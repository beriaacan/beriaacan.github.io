<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Beria Can</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        })();
    </script>

    <header>
        <a href="index.html" class="brand">
            <img class="brand-avatar" src="img/profile.jpeg" alt="Avatar">
            <span class="brand-name">Beria Can</span>
        </a>
        <nav>
            <a href="index.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="education.html">Education</a>
            <a href="contact.html" class="active">Contact</a>
            <button id="theme-toggle" class="theme-btn">☾ Dark Mode</button>
        </nav>
    </header>

    <div class="wrap">
        <main>
            <h1>Get in Touch</h1>
            <p>Feel free to drop me a message below!</p>

            <section class="contact-grid">
                <div class="contact-info">
                    <ul class="info-list">
                        <li><strong>Email:</strong>  <a href="mailto:beria.aysenur.can@cern.ch">beria.aysenur.can@cern.ch</a></li>
                        <li><strong>Location:</strong> Geneva, Switzerland (CERN)</li>
                    </ul>

                    <h3 style="margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem;">Profiles</h3>
                    <div class="social-links">
                        <a href="https://www.linkedin.com/in/beriaacan/" target="_blank" class="social-btn">LinkedIn</a>
                        <a href="https://github.com/beriaacan" target="_blank" class="social-btn">GitHub</a>
                        <a href="https://www.hackerrank.com/beriaacan" target="_blank" class="social-btn">HackerRank</a>
                        <a href="https://leetcode.com/u/beriaacan/" target="_blank" class="social-btn">LeetCode</a>
                        <a href="https://x.com/beriaacan" target="_blank" class="social-btn">X</a>
                    </div>
                </div>

                <div class="contact-form-container">
                    <form action="https://formspree.io/f/FORM_ID_BURAYA" method="POST" class="contact-form">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>

                        <button type="submit" class="btn-primary form-submit">Send Message</button>
                    </form>
                </div>
            </section>

            <hr style="margin: 3rem 0; border: 0; border-top: 1px solid var(--border);">

            <section>
                <h2>CV</h2>
                <p>You can download my CV via the button below.</p>
                <a href="CV.pdf" download class="btn-primary">Download CV (PDF)</a>
            </section>
        </main>
    </div>
    
    <footer style="text-align: center; margin-top: 4rem; margin-bottom: 2rem; color: var(--muted); font-size: 0.8rem;">
    </footer>

    <script src="js/theme.js"></script>
</body>
</html>
