<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact | Beria Can</title>
    <meta name="description" content="Contact Beria Can — Master’s student at ITU, CMS Collaboration at CERN.">
    <meta property="og:title" content="Contact | Beria Can">
    <meta property="og:description" content="M.Sc. Physics Engineering @ ITU · CMS / CERN.">
    <meta property="og:image" content="img/profile.jpeg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <header>
        <a href="index.html" class="brand">
            <img class="brand-avatar" src="img/profile.jpeg" alt="Avatar">
            <span class="brand-name">Beria Can</span>
        </a>
        <nav>
            <a href="index.html">About</a>
            <a href="research.html">Research</a>
            <a href="publications.html">Publications</a>
            <a href="notes.html">Notes</a>
            <a href="cv.html">CV</a>
            <a href="contact.html" class="active">Contact</a>
            <button id="theme-toggle" class="theme-btn">☾ Dark Mode</button>
        </nav>
    </header>

    <div class="wrap">
        <main>
            <h1>Contact</h1>
            <p>For research or collaboration questions, email is best.</p>

            <section class="contact-grid">
                <div class="contact-info">
                    <ul class="info-list">
                        <li><strong>Email</strong> <a href="mailto:beria.aysenur.can@cern.ch">beria.aysenur.can@cern.ch</a></li>
                        <li><strong>Affiliation</strong> <span>ITU · CMS / CERN</span></li>
                        <li><strong>Location</strong> <span>Geneva, Switzerland</span></li>
                    </ul>

                    <h3 style="margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem;">Elsewhere</h3>
                    <div class="social-links">
                        <a href="https://github.com/beriaacan" target="_blank" rel="noopener noreferrer" class="social-btn">GitHub</a>
                        <a href="https://www.linkedin.com/in/beriaacan/" target="_blank" rel="noopener noreferrer" class="social-btn">LinkedIn</a>
                    </div>
                </div>

                <div class="contact-form-container">
                    <form id="contact-form" action="https://formspree.io/f/meegoajg" method="POST" class="contact-form">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>

                        <button type="submit" id="form-submit-btn" class="btn-primary form-submit">Send</button>
                        <div id="form-status" class="form-message"></div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <footer style="text-align: center; margin-top: 4rem; margin-bottom: 2rem; color: var(--muted); font-size: 0.8rem;">
            &copy; Beria Can · CMS / CERN
        </footer>

    <script src="js/theme.js"></script>
    <script>
        const form = document.getElementById("contact-form");
        const status = document.getElementById("form-status");
        const btn = document.getElementById("form-submit-btn");

        async function handleSubmit(event) {
            event.preventDefault();
            btn.disabled = true;
            btn.innerText = "Sending...";

            const data = new FormData(event.target);

            try {
                const response = await fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    status.innerHTML = "Thanks — I’ll get back to you by email.";
                    status.className = "form-message success";
                    form.reset();
                    btn.innerText = "Sent";
                } else {
                    const result = await response.json();
                    status.innerHTML = result.errors ? result.errors.map(error => error.message).join(", ") : "Something went wrong. Please email me directly.";
                    status.className = "form-message error";
                    btn.disabled = false;
                    btn.innerText = "Send";
                }
            } catch (error) {
                status.innerHTML = "Network error. Please email me directly.";
                status.className = "form-message error";
                btn.disabled = false;
                btn.innerText = "Send";
            }
        }
        form.addEventListener("submit", handleSubmit);
    </script>
</body>
</html>
